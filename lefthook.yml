# lefthook —— 本地 git hooks
#
# ⚠️ 本仓库**不设** core.hooksPath。原因是全局 ~/.gitconfig 里已有
#    `hooksPath = /Users/admin/.git-hooks`（一套 prehooks v12 框架，负责写
#    /tmp/<repo>_change_notify 给外部进程轮询，且它本身会 call_lefthook()）。
#    若用 husky，它会设仓库级 core.hooksPath=.husky/_ 把上面那套整个顶掉。
#    所以这里只提供 lefthook.yml，由全局 hook 委托进来——零冲突。
#
# 仓库根目录会被 hook 脚本解析成 $repo，故 lefthook 二进制必须装在 devDependencies
# （hook 的查找路径是 $repo/node_modules/lefthook-<os>-<arch>/bin/lefthook）。

pre-commit:
  parallel: false
  commands:
    nl-offline-eval:
      # 改了 NL 检索（reco/**）就跑离线回放评测——**0 元 / 0 网络 / 2.8 秒**。
      #
      # 为什么挂在 pre-commit：NL 歌单的质量问题是"改了但行为没变"型
      # （2026-10-20 实测：候选池缓存 key 不含构建参数 → 改了参数，旧缓存命中
      # 10 分钟 → 连续三轮评测数字一模一样）。这种问题只有"每次改动都自动量
      # 一遍"才抓得到，靠自觉跑是抓不到的。
      #
      # 门禁判据 = 7 条不变量 + 纯度不低于入库基线（specs/eval-driven-nl/）。
      glob: 'packages/server/src/reco/**'
      run: cd packages/server && npx ts-node src/reco/eval-offline-cli.ts
    prettier:
      # 只对**暂存区**的文件跑，且只格式化 git 已跟踪的类型。
      # lint-staged 会在格式化后自动重新 add（v15+ 不再需要显式 git add）。
      # 目的是「增量不再恶化」——存量已由 PR #103 一次性对齐，这里只管新改动。
      glob: '*.{ts,tsx,mjs,js,json,md,scss,html,yml,yaml}'
      run: npx lint-staged

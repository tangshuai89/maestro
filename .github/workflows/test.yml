name: Test & TypeCheck & Lint

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # @maestro/common 的 main/types 指向 dist（编译产物，不入库）——server
      # 的 tsc 和 ts-node 都按 node_modules 解析它，CI 干净环境必须先构建，
      # 否则 typecheck / npm test 报 "Cannot find module '@maestro/common'"。
      - name: Build @maestro/common
        run: npm run build:common

      - name: TypeScript type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Coverage report
        run: npm run test:coverage
        continue-on-error: true

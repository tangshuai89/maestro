name: Test & TypeCheck & Lint

# 触发策略（2026-10-21 拆分）：
#
#   pull_request           → 快门禁（typecheck + lint + test:ci），约 8 分钟
#   push 到 master         → 同一个快门禁，主干也守住
#   feature 分支的 push    → **不再触发**。以前这里是 push + pull_request 两个
#     触发源，同一个 PR 会跑**两遍**全量（push 事件一次、PR 事件一次）
#     → 每个 PR 白烧 30 分钟 runner。
#
# 覆盖率**不在这个 workflow 里跑** —— 它是仓库健康度指标（全局数字，拦不住
# 任何具体的坏 PR），挪到 coverage.yml 的**每日定时**里跑了。
#
# 为什么覆盖率要挪走、而不是留在 PR 上：
#   1. 它衡量的是「整个仓库」而不是「这个 PR」—— 一个 PR 把某个文件从 80% 拉到
#      0%，全局仍然过；阈值 ≥60% 只有在仓库整体这个粒度上才有意义。
#   2. 更要紧的是它**跑的是另一遍套件**，和 test:ci 的判定**不是同一次执行**
#      → 会产出自相矛盾的数字。实测踩过：某个测试文件跑不起来时，
#      reco.service.ts 的覆盖率从 80.27% 塌成 32.88%，看着像天大的覆盖洞，
#      其实只是那次测试没跑成。任何「跑两遍」的架构都会这么拧巴。
on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    # ⚠️ **必须设 job 级超时**（默认 360 分钟 = 6 小时）。
    #   实测踩过：浏览器覆盖采集的子进程没被清理 → 父进程永不退出 →
    #   这一步卡满 6 小时才被 GitHub 强杀（2026-10-22，PR #114）。
    #   根因已修（杀进程组 + 子进程 timeout + 脚本看门狗），
    #   但**任何**未来未预料的挂起都不该再烧掉 6 小时和一份 runner 额度。
    timeout-minutes: 45

    steps:
      # ⚠️ **必须 fetch-depth: 0**（不能是默认的 1）：覆盖率 diff 门禁要拿
      # `git diff <base>...HEAD` 算「本次 PR 新增/改了哪些行」→ shallow
      # clone 下拿不到 base 的 commit → 门禁无法计算。
      #
      # ⚠️ 拿不到 base 时门禁**明确失败**（退出 2），不是静默放过 ——
      # 静默放过 = 门禁形同虚设（这正是旧门禁的毛病）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ⚠️ Node 版本**不能降回 20**：renderer 的 20 个 `*.test.mjs` 用自实现的
      # ESM loader 直接 import `*.ts` 源码（不走打包器），依赖 Node ≥ 22.18 的
      # **type stripping**。Node 20 上 `defaultLoad` 直接抛
      # `ERR_UNKNOWN_FILE_EXTENSION: Unknown file extension ".ts"` → 整段 .test.mjs
      # 在 CI 上**从来没跑起来过**。这个失败被旧门禁的 `|| true` + 恒 0 退出码
      # 盖住了 —— 门禁改成真门禁后（见 scripts/test.sh）它第一次显形。
      # 本地开发用的也是 22.x，CI 跟本地对齐。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # @maestro/common 的 main/types 指向 dist（编译产物，不入库）——server
      # 的 tsc 和 ts-node 都按 node_modules 解析它，CI 干净环境必须先构建，
      # 否则 typecheck / npm test 报 "Cannot find module '@maestro/common'"。
      - name: Build @maestro/common
        run: npm run build:common

      # ⚠️ 浏览器覆盖采集（接线层 App.tsx / main.tsx）需要 Chromium。
      #   单元测试**碰不到** App.tsx（纯接线层）→ 它的行覆盖恒为 0% →
      #   diff 门禁会把「改 App.tsx」误判成「新增行没被执行过」→ 误拦。
      #   装了浏览器，采集器就能把接线层的覆盖**真实地**记下来。
      - name: Install Chromium（浏览器覆盖采集用）
        run: npx playwright install --with-deps chromium

      - name: TypeScript type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 采集 + 判定 + 打印覆盖率报告（**不判全局阈值**：全局覆盖率在 PR 上判是
      # 粒度错配 —— 它拦不住任何具体的坏 PR，阈值留给 master，见下一步）。
      # PR 上的覆盖率把关由**下面的 diff 粒度门禁**做（判据：本次新增/修改的
      # 代码行必须被执行过）。
      - name: Run tests
        run: npm run test:ci

      # 阈值门禁只在 **master 的 push** 上判。这一步**复用上一步刚采集的数据**
      # （scripts/test.sh 的 --coverage 看到 30 分钟内的新鲜数据就不重跑），
      # 所以它几乎不花时间 —— 覆盖率数字和「过没过」来自**同一次执行**，
      # 不会再出现「某个测试文件挂了 → 覆盖率塌成假洞」那种自相矛盾。
      - name: Coverage threshold gate (≥60%)
        if: github.event_name == 'push'
        run: npm run test:coverage

      # ── 覆盖率 diff 门禁（PR only）───────────────────────────────
      #
      # 全局阈值在 90% 的水位上等于不存在：实测要新增 **21324 行**零覆盖
      # 代码才跌破 60% → 它拦不住任何"具体的坏 PR"。这个门禁换判据：
      # **本次 PR 新增/修改的代码行必须被执行过**。
      #
      # 为什么不需要 base 分支的覆盖率基线：它问的是"你这次写的代码有没有被
      # 跑到"，不是"比上次差多少"。所以不需要跑两遍套件、不需要存基线快照。
      #
      # 数据来源是**上一步 test:ci 刚采集的** lcov（test:ci 是插桩跑的，
      # 已经在采集覆盖率）→ 不额外花时间，也保证"过没过"和"覆盖多少"来自
      # 同一次执行。
      - name: Coverage diff gate (新增代码必须被测到)
        if: github.event_name == 'pull_request'
        # ⚠️ --trust 是「行覆盖可信文件」清单（collect-line-coverage-trust.js 生成）。
        #   不传 → 门禁**明确失败**（退出码 2），不硬判：不知道哪些文件的行号可信时，
        #   拿行级数据判 = 拿可能错位的行号当真值。
        run: |
          node scripts/coverage-diff-gate.js \
            --base ${{ github.event.pull_request.base.sha }} \
            --trust coverage/.line-coverage-trusted.txt
